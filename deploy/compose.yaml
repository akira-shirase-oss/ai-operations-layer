# The AI Operations Layer's local development stack: the one PostgreSQL the collector
# needs. Started and checked with `scripts/stack.sh up`.
#
# Development only. Every port is bound to 127.0.0.1 and the credentials are public.
# Ports: PostgreSQL 57432; the collector (native, not in compose) 57400; the reference
# host 57401. Other stacks on this machine use 55432, 56xxx and 58000-58099; keep clear.
#
# The image is pinned by digest. To upgrade, change the tag, look up the new digest with
# `docker buildx imagetools inspect <image>:<tag>`, and rerun the store tests.
name: ai-operations-layer

services:
  postgres:
    image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    command:
      - postgres
      # Room for three collector pools, the tests' per-test databases and a load run.
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      # Durability stays on: fsync and synchronous_commit keep their defaults, so load
      # numbers are for acknowledged, durable writes.
    environment:
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: aiops-dev
      POSTGRES_DB: aiops
    ports:
      - "127.0.0.1:${AIOPS_PG_PORT:-57432}:5432"
    volumes:
      # PostgreSQL 18 images keep their data in a versioned directory under
      # /var/lib/postgresql, so the volume is mounted there, not at .../data.
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=aiops", "--dbname=aiops"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s

volumes:
  postgres:
