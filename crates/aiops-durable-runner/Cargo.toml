[package]
name = "aiops-durable-runner"
description = "The AI Operations Layer's Durable Runner adapter: a handler proxy that reports what the runner did, and reads the runner's own answer for the outcome."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "aiops-dr-adapter"
path = "src/main.rs"

[dependencies]
aiops-domain.workspace = true
aiops-sdk.workspace = true
anyhow.workspace = true
axum.workspace = true
http-body.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }

[lints]
workspace = true
