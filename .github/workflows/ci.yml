name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (toolchain, fmt, clippy, tests against PostgreSQL, architecture)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      # The same image as deploy/compose.yaml, pinned by digest.
      postgres:
        image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_USER: aiops
          POSTGRES_PASSWORD: aiops-dev
          POSTGRES_DB: aiops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=aiops --dbname=aiops"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://aiops:aiops-dev@127.0.0.1:5432/aiops
    steps:
      # Third-party actions are pinned to commit SHAs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/check-toolchain.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: scripts/check-isolated.sh
      # Fuzz smoke: every outside-input parser's never-panics target, bounded
      # at 512 cases each (seed corpora run deterministically inside the tests).
      - run: PROPTEST_CASES=512 cargo test --workspace --locked --test fuzz
      # The labelled redaction corpus — the review's Ruling: 100% recall on
      # MUST_REDACT, zero-budget MUST_KEEP, the random-base64 ≥8-byte property
      # and the Unicode never-panics property, all at 512 cases.
      - run: PROPTEST_CASES=512 cargo test -p aiops-domain --locked --test redaction_corpus
      # Includes the tests/attacks pentest suite against the postgres service.
      - run: cargo test --workspace --locked
      - run: scripts/check-architecture.sh
      - run: scripts/check-perf-scenarios.sh

  # The mutation proof (workspace rule, 2026-11-20): for each named mutant in
  # tests/attacks/mutants.py, apply it, require its attack test to go red,
  # restore. A suite that passes with its protection deleted proves nothing.
  attack-mutations:
    name: attack mutations (each attack red without its protection)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_USER: aiops
          POSTGRES_PASSWORD: aiops-dev
          POSTGRES_DB: aiops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=aiops --dbname=aiops"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://aiops:aiops-dev@127.0.0.1:5432/aiops
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/prove-attacks.sh

  console:
    name: console (svelte-check, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check --workspace @aiops/console
      - run: npm run build --workspace @aiops/console

  # The investigation view in Chromium against the release collector, the reference host
  # and real PostgreSQL, then the first real host: Durable Runner built from its public
  # repository at the tested revision (scripts/console-e2e.sh, scripts/durable-runner.sh).
  console-e2e:
    name: console journey (Chromium, real collector and reference host)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_USER: aiops
          POSTGRES_PASSWORD: aiops-dev
          POSTGRES_DB: aiops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=aiops --dbname=aiops"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://aiops:aiops-dev@127.0.0.1:5432/aiops
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx -w @aiops/console playwright install --with-deps chromium
      - run: scripts/console-e2e.sh
      - name: Upload the Playwright failure artifacts (error-context, traces, screenshots)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-e2e-${{ github.run_id }}
          # trace.zip records typed input and Bearer headers; error-context.md
          # snapshots the page DOM — a typed token sits in the input's value.
          path: |
            apps/console/test-results/
            !apps/console/test-results/**/trace.zip
            !apps/console/test-results/**/error-context.md
          retention-days: 7
          if-no-files-found: warn
      - name: The production path (env-only config, migrate, admin, console, a host, SIGTERM)
        run: scripts/production-smoke.sh
