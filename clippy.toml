# Production code may not unwrap or expect; tests may, so they stay readable.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-dbg-in-tests = true

# Proper names, not code. ".." keeps Clippy's default list.
doc-valid-idents = ["OTel", "OpenTelemetry", "SvelteKit", "PostgreSQL", ".."]
